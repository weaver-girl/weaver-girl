<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examples - Weaver-Girl</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Weaver-Girl</h1>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/docs.html">Docs</a>
        <a href="/plugins.html">Plugins</a>
        <a href="/about.html">About</a>
        <a href="/config.html">Config</a>
        <a href="/api.html">API</a>
        <a href="/examples.html">Examples</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Examples</h2>
      <p>Learn how to use the framework with real instrumentation scenarios.</p>
    </section>

    <section class="features">
      <h3>Usage Examples</h3>
      <ul id="examples-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Weaver-Girl. MIT License.</p>
    </div>
  </footer>

  <script>
    fetch('/examples')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('examples-list');
        (data.examples || []).forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${item.title}</strong><br/><pre>${item.code}</pre><p>${item.description}</p>`;
          list.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById('examples-list').innerHTML = '<li>Failed to load examples.</li>';
      });
  </script>
</body>
</html>
