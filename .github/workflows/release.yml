name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run proves the build, signing and packaging pipeline without a tag and
  # without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (for example 1.0.0-rc.1)
        required: true
      dry_run:
        description: Build, sign and package, but do not publish or create a release
        type: boolean
        default: true

# softprops/action-gh-release creates the release and uploads assets with the
# workflow token; without this the default read-only token fails at upload.
permissions:
  contents: write

jobs:
  # Validates the version and reports whether Maven Central publishing is possible.
  #
  # This is a separate job because `secrets` cannot be read in a job-level `if`:
  # a job that needs to know whether CENTRAL_USERNAME/CENTRAL_TOKEN exist has to
  # learn it from an earlier job's output. Keeping the check here also means a
  # missing Central credential is a *skip* with a visible warning, not a failure
  # that takes the GitHub Release down with it — the release is the thing users
  # download, and it does not depend on Central being reachable or configured.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      has_central: ${{ steps.creds.outputs.has_central }}
    steps:
      - name: Resolve the release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          test -n "$TAG_VERSION" || (echo "FAIL: no version" && exit 1)
          # A SNAPSHOT is not accepted by Central, and a mistyped version burns the tag on a
          # staging deployment nobody can publish. Reject both before touching anything.
          if printf '%s' "$TAG_VERSION" | grep -qi 'SNAPSHOT'; then
            echo "::error::$TAG_VERSION is a SNAPSHOT; only release versions can be published"
            exit 1
          fi
          if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$'; then
            echo "::error::$TAG_VERSION is not a semantic version"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $TAG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          # A 1.0.0-rc.1 tag must not be presented as the stable release.
          if printf '%s' "$TAG_VERSION" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether Maven Central publishing is configured
        id: creds
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$CENTRAL_TOKEN" ]; then
            echo "has_central=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_central=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CENTRAL_USERNAME/CENTRAL_TOKEN are not configured; the Maven Central job will be skipped. The GitHub Release still ships the distribution archive. See RELEASE_PROCEDURE.md."
          fi

  # Builds, signs and publishes the GitHub Release. Never depends on Maven Central.
  github-release:
    name: Build & Publish GitHub Release
    needs: preflight
    runs-on: ubuntu-latest
    env:
      # Every artifact name below is derived from this, so the release step never has to
      # discover paths through `find` output that another step exported.
      VERSION: ${{ needs.preflight.outputs.version }}
      AGENT_JAR: weaver-girl-agent/target/weaver-girl-agent-${{ needs.preflight.outputs.version }}.jar
      DIST_ZIP: weaver-girl-agent/target/weaver-girl-agent-${{ needs.preflight.outputs.version }}-dist.zip
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (release)
        uses: actions/setup-java@v6
        with:
          # The compiler plugin still targets Java 1.8 bytecode; JDK 17 is used so the
          # Maven release tooling (gpg signing, javadoc) runs.
          java-version: 17
          distribution: temurin
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set the Maven version from the tag
        run: ./mvnw versions:set -DnewVersion=${{ needs.preflight.outputs.version }} -B

      - name: Build and sign the artifacts
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # The release profile attaches sources/javadoc and signs them. Tests are skipped here:
        # a tag only exists for a commit whose CI gate is already green, and running the full
        # 3,800-test suite again would double the time between tag and release for no new signal.
        run: >-
          ./mvnw -B -Prelease clean verify -DskipTests
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true

      - name: Verify agent JAR
        run: |
          echo "Agent JAR: $AGENT_JAR"
          test -f "$AGENT_JAR" || { echo "FAIL: $AGENT_JAR not found"; ls weaver-girl-agent/target/*.jar; exit 1; }
          echo "=== Manifest ==="
          MANIFEST=$(unzip -p "$AGENT_JAR" META-INF/MANIFEST.MF)
          printf '%s\n' "$MANIFEST"
          case "$MANIFEST" in
            *"Premain-Class:"*) ;;
            *) echo "FAIL: no Premain-Class" && exit 1 ;;
          esac
          case "$MANIFEST" in
            *"Agent-Class:"*) ;;
            *) echo "FAIL: no Agent-Class" && exit 1 ;;
          esac

      - name: Verify distribution archive
        run: |
          test -f "$DIST_ZIP" || { echo "FAIL: $DIST_ZIP not found"; ls weaver-girl-agent/target/*.zip; exit 1; }
          # The agent has no built-in plugin classes; it loads them from plugins/ next to the jar.
          # A jar-only release would instrument nothing.
          DIST_LISTING=$(unzip -l "$DIST_ZIP")
          PLUGIN_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-.*\.jar$')
          echo "Plugin jars in distribution: $PLUGIN_COUNT"
          test "$PLUGIN_COUNT" -gt 0 || (echo "FAIL: distribution has no plugin jars" && exit 1)
          SERVLET_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-servlet-.*\.jar$')
          JDBC_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-jdbc-.*\.jar$')
          test "$SERVLET_COUNT" -gt 0 || (echo "FAIL: distribution is missing the servlet plugin" && exit 1)
          test "$JDBC_COUNT" -gt 0 || (echo "FAIL: distribution is missing the jdbc plugin" && exit 1)

      - name: Generate checksums
        run: |
          # Record bare file names: users run `sha256sum -c` on the downloaded asset in a
          # different directory than the build workspace.
          for artifact in "$AGENT_JAR" "$DIST_ZIP"; do
            ( cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256" )
          done
          echo "=== Checksums ==="
          cat "$AGENT_JAR.sha256" "$DIST_ZIP.sha256"

      - name: Sign the distribution archive and the bare agent jar
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Both artifacts are published as assets and the docs tell users to verify with
          # gpg, so both need a detached signature — the agent jar is what people attach
          # when they already have a plugins/ directory.
          for artifact in "$DIST_ZIP" "$AGENT_JAR"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign "$artifact"
            gpg --verify "$artifact.asc" "$artifact"
          done

      - name: Write the release notes
        run: |
          {
            echo "## Installation"
            echo
            echo "The distribution archive contains the agent jar and the \`plugins/\` directory it"
            echo "discovers built-in capabilities from. Download the archive, not the bare jar —"
            echo "an agent without \`plugins/\` instruments nothing."
            echo
            echo '```bash'
            echo "# Download the archive and its checksum (keep the original file names)"
            echo "curl -LO https://github.com/weaver-girl/weaver-girl/releases/download/${{ github.ref_name }}/weaver-girl-agent-${{ env.VERSION }}-dist.zip"
            echo "curl -LO https://github.com/weaver-girl/weaver-girl/releases/download/${{ github.ref_name }}/weaver-girl-agent-${{ env.VERSION }}-dist.zip.sha256"
            echo "sha256sum -c weaver-girl-agent-${{ env.VERSION }}-dist.zip.sha256"
            echo
            echo "# Verify the signature (public key: docs/release-signing-key.asc)"
            echo "gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 56EF998B96FA1B31"
            echo "gpg --verify weaver-girl-agent-${{ env.VERSION }}-dist.zip.asc weaver-girl-agent-${{ env.VERSION }}-dist.zip"
            echo
            echo "# Unpack and attach (the plugins/ directory must stay next to the jar)"
            echo "unzip weaver-girl-agent-${{ env.VERSION }}-dist.zip"
            echo "java -javaagent:weaver-girl-agent-${{ env.VERSION }}/weaver-girl-agent-${{ env.VERSION }}.jar -jar your-app.jar"
            echo '```'
            echo
            echo "## Maven Central"
            echo
            echo "The artifacts use the group id \`io.github.cc11001100\`:"
            echo
            echo '```xml'
            echo "<dependency>"
            echo "  <groupId>io.github.cc11001100</groupId>"
            echo "  <artifactId>weaver-girl-core</artifactId>"
            echo "  <version>${{ env.VERSION }}</version>"
            echo "</dependency>"
            echo '```'
            echo
            echo "Whether this version is visible on Central depends on the \`maven-central\` job of"
            echo "this workflow run — check that job before pointing a build at the coordinates."
            echo
            echo "## What's Included"
            echo "- Built-in instrumentation plugins (Servlet, Spring, JDBC, Redis, Kafka, gRPC,"
            echo "  MongoDB, Dubbo, MyBatis, RocketMQ, Druid, Feign, and more), one jar per capability,"
            echo "  loaded only when its target library is present"
            echo "- Runtime capability jars (metrics, health, OTLP export, JSON events, JMX,"
            echo "  config watch, diagnostics, taint, and more)"
            echo "- Adaptive sampling, circuit breaker, JMX diagnostics"
            echo "- Global emergency kill-switch"
            echo "- Hot-reload support"
            echo
            echo "## Requirements"
            echo "- Java 1.8+"
          } > release-notes.md
          cat release-notes.md

      - name: Upload release assets as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weaver-girl-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            ${{ env.AGENT_JAR }}
            ${{ env.AGENT_JAR }}.sha256
            ${{ env.AGENT_JAR }}.asc
            ${{ env.DIST_ZIP }}
            ${{ env.DIST_ZIP }}.sha256
            ${{ env.DIST_ZIP }}.asc

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          name: Weaver-Girl ${{ needs.preflight.outputs.version }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.preflight.outputs.version) }}
          body_path: release-notes.md
          files: |
            ${{ env.AGENT_JAR }}
            ${{ env.AGENT_JAR }}.sha256
            ${{ env.AGENT_JAR }}.asc
            ${{ env.DIST_ZIP }}
            ${{ env.DIST_ZIP }}.sha256
            ${{ env.DIST_ZIP }}.asc
          draft: false
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}

  # Publishes to Maven Central. Skipped (not failed) when the credentials are absent, so a
  # release without Central access still produces a GitHub Release.
  maven-central:
    name: Publish to Maven Central
    needs:
      - preflight
      - github-release
    if: needs.preflight.outputs.has_central == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (release)
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set the Maven version from the tag
        run: ./mvnw versions:set -DnewVersion=${{ needs.preflight.outputs.version }} -B

      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # A release must pass the same quality gate as a pull request.
        run: ./mvnw -B -Pquality-gate,release clean deploy
