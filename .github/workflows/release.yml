name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Deploy & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (release)
        uses: actions/setup-java@v6
        with:
          # The compiler plugin still targets Java 1.8 bytecode; JDK 17 is used so the
          # Maven release tooling (central-publishing-maven-plugin) and GPG signing run.
          java-version: 17
          distribution: temurin
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Setting Maven version to $TAG_VERSION"
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV
          ./mvnw versions:set -DnewVersion=$TAG_VERSION -B

      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # A release must pass the same quality gate as a pull request.
        run: ./mvnw -B -Pquality-gate,release clean deploy

      - name: Verify agent JAR
        run: |
          AGENT_JAR=$(find weaver-girl-agent/target -name "weaver-girl-agent-*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          echo "Agent JAR: $AGENT_JAR"
          test -n "$AGENT_JAR" || (echo "FAIL: No agent JAR found" && exit 1)
          echo "=== Manifest ==="
          MANIFEST=$(unzip -p "$AGENT_JAR" META-INF/MANIFEST.MF)
          printf '%s\n' "$MANIFEST"
          case "$MANIFEST" in
            *"Premain-Class:"*) ;;
            *) echo "FAIL: no Premain-Class" && exit 1 ;;
          esac
          case "$MANIFEST" in
            *"Agent-Class:"*) ;;
            *) echo "FAIL: no Agent-Class" && exit 1 ;;
          esac
          echo "AGENT_JAR=$AGENT_JAR" >> $GITHUB_ENV

      - name: Verify distribution archive
        run: |
          DIST_ZIP=$(find weaver-girl-agent/target -name "weaver-girl-agent-*-dist.zip" | head -1)
          test -n "$DIST_ZIP" || (echo "FAIL: No distribution archive found" && exit 1)
          # The agent has no built-in plugin classes; it loads them from plugins/ next to the jar.
          # A jar-only release would instrument nothing.
          DIST_LISTING=$(unzip -l "$DIST_ZIP")
          PLUGIN_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-.*\.jar$')
          echo "Plugin jars in distribution: $PLUGIN_COUNT"
          test "$PLUGIN_COUNT" -gt 0 || (echo "FAIL: distribution has no plugin jars" && exit 1)
          SERVLET_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-servlet-.*\.jar$')
          JDBC_COUNT=$(printf '%s\n' "$DIST_LISTING" | grep -c 'plugins/weaver-girl-plugin-jdbc-.*\.jar$')
          test "$SERVLET_COUNT" -gt 0 || (echo "FAIL: distribution is missing the servlet plugin" && exit 1)
          test "$JDBC_COUNT" -gt 0 || (echo "FAIL: distribution is missing the jdbc plugin" && exit 1)
          echo "DIST_ZIP=$DIST_ZIP" >> $GITHUB_ENV

      - name: Generate checksums
        run: |
          # Record bare file names: users run `sha256sum -c` on the downloaded asset in a
          # different directory than the build workspace.
          ( cd "$(dirname "$AGENT_JAR")" && sha256sum "$(basename "$AGENT_JAR")" > "$(basename "$AGENT_JAR").sha256" )
          ( cd "$(dirname "$DIST_ZIP")" && sha256sum "$(basename "$DIST_ZIP")" > "$(basename "$DIST_ZIP").sha256" )
          echo "=== Checksums ==="
          cat "$AGENT_JAR.sha256" "$DIST_ZIP.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Weaver-Girl ${{ github.ref_name }}
          body: |
            ## Installation

            The distribution archive contains the agent jar and the `plugins/` directory it
            discovers built-in capabilities from. Download the archive, not the bare jar —
            an agent without `plugins/` instruments nothing.

            ```bash
            # Download the archive and its checksum (keep the original file names)
            curl -LO https://github.com/weaver-girl/weaver-girl/releases/download/${{ github.ref_name }}/weaver-girl-agent-${{ env.VERSION }}-dist.zip
            curl -LO https://github.com/weaver-girl/weaver-girl/releases/download/${{ github.ref_name }}/weaver-girl-agent-${{ env.VERSION }}-dist.zip.sha256
            sha256sum -c weaver-girl-agent-${{ env.VERSION }}-dist.zip.sha256

            # Unpack and attach (the plugins/ directory must stay next to the jar)
            unzip weaver-girl-agent-${{ env.VERSION }}-dist.zip
            java -javaagent:weaver-girl-agent-${{ env.VERSION }}/weaver-girl-agent-${{ env.VERSION }}.jar -jar your-app.jar
            ```

            ## Maven Central

            Artifacts are published to Maven Central under
            `io.github.cc11001100:weaver-girl-*`.

            ```xml
            <dependency>
              <groupId>io.github.cc11001100</groupId>
              <artifactId>weaver-girl-core</artifactId>
              <version>${{ env.VERSION }}</version>
            </dependency>
            ```

            ## What's Included
            - 126 built-in instrumentation plugins (Servlet, Spring, JDBC, Redis, Kafka, gRPC,
              MongoDB, Dubbo, MyBatis, RocketMQ, Druid, Feign, and more), one jar per capability,
              loaded only when its target library is present
            - 14 runtime capability jars (metrics, health, OTLP export, JSON events, JMX,
              config watch, diagnostics, taint, and more)
            - Adaptive sampling, circuit breaker, JMX diagnostics
            - Global emergency kill-switch
            - Hot-reload support

            ## Requirements
            - Java 1.8+
          files: |
            ${{ env.AGENT_JAR }}
            ${{ env.AGENT_JAR }}.sha256
            ${{ env.DIST_ZIP }}
            ${{ env.DIST_ZIP }}.sha256
          draft: false
          prerelease: false
