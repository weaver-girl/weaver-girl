# Extension auto-detection is off by default; the core module needs it so the
# ProcessWideStateExtension registered in META-INF/services resets the engine's
# static singletons around every test. Without it, one test's config (emergency
# mode, a sampling rate, a disabled kill-switch) leaks into the next one and
# fails it as "before() should have been called" — only in a full-suite run.
junit.jupiter.extensions.autodetection.enabled=true
