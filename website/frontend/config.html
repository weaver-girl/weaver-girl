<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Config - Weaver-Girl</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Weaver-Girl</h1>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/docs.html">Docs</a>
        <a href="/plugins.html">Plugins</a>
        <a href="/about.html">About</a>
        <a href="/config.html">Config</a>
        <a href="/api.html">API</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Configuration</h2>
      <p>Example configuration and quick reference.</p>
    </section>

    <section class="features">
      <h3>Config Example</h3>
      <ul id="config-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Weaver-Girl. MIT License.</p>
    </div>
  </footer>

  <script>
    fetch('/config')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('config-list');
        const li = document.createElement('li');
        li.innerHTML = `<strong>${data.title}</strong><br/><pre>${data.example}</pre>`;
        list.appendChild(li);
      })
      .catch(() => {
        document.getElementById('config-list').innerHTML = '<li>Failed to load config.</li>';
      });
  </script>
</body>
</html>
