<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About - Weaver-Girl</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Weaver-Girl</h1>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/docs.html">Docs</a>
        <a href="/plugins.html">Plugins</a>
        <a href="/about.html">About</a>
        <a href="/config.html">Config</a>
        <a href="/api.html">API</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>About</h2>
      <p>Project overview and quick links.</p>
    </section>

    <section class="features">
      <h3>Project Info</h3>
      <ul id="about-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Weaver-Girl. MIT License.</p>
    </div>
  </footer>

  <script>
    fetch('/about')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('about-list');
        const entries = [
          { label: 'Name', value: data.name },
          { label: 'Description', value: data.description },
          { label: 'Version', value: data.version },
          { label: 'License', value: data.license },
          { label: 'Repository', value: data.repository }
        ];
        entries.forEach(entry => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${entry.label}:</strong> ${entry.value}`;
          list.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById('about-list').innerHTML = '<li>Failed to load about info.</li>';
      });
  </script>
</body>
</html>
