name: GitHub Pages (redirect)

# The site itself lives in weaver-girl/weaver-girl.github.io and is deployed at
# https://weaver-girl.github.io/. This workflow only keeps the old project-site
# URL (/weaver-girl/) working as a redirect, preserving the route.

on:
  push:
    branches: [main]
    paths:
      - "site-redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build redirect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add redirect at every route
        run: |
          mkdir -p dist
          for route in "" quick-start cases plugins architecture docs; do
            mkdir -p "dist/$route"
            cp site-redirect/index.html "dist/$route/index.html"
          done
          cp site-redirect/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
