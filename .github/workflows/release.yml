name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Deploy & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (release)
        uses: actions/setup-java@v4
        with:
          # The compiler plugin still targets Java 1.8 bytecode; JDK 17 is used so the
          # Maven release tooling (central-publishing-maven-plugin) and GPG signing run.
          java-version: 17
          distribution: temurin
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Setting Maven version to $TAG_VERSION"
          ./mvnw versions:set -DnewVersion=$TAG_VERSION -B

      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # clean deploy runs the full lifecycle (tests + package + sign + publish).
        # quality-gate is explicitly disabled here only to avoid re-running the
        # coverage check twice; every PR already enforces it in ci.yml.
        run: ./mvnw -B -Prelease,-quality-gate clean deploy

      - name: Verify agent JAR
        run: |
          AGENT_JAR=$(find weaver-girl-agent/target -name "weaver-girl-agent-*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          echo "Agent JAR: $AGENT_JAR"
          test -n "$AGENT_JAR" || (echo "FAIL: No agent JAR found" && exit 1)
          echo "=== Manifest ==="
          unzip -p "$AGENT_JAR" META-INF/MANIFEST.MF | head -10
          echo "=== Plugin count ==="
          jar tf "$AGENT_JAR" | grep 'plugins/.*Plugin\.class' | grep -v '\$' | wc -l
          echo "AGENT_JAR=$AGENT_JAR" >> $GITHUB_ENV

      - name: Generate checksum
        run: |
          sha256sum $AGENT_JAR > $AGENT_JAR.sha256
          echo "=== Checksum ==="
          cat $AGENT_JAR.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Weaver-Girl ${{ github.ref_name }}
          body: |
            ## Installation

            ```bash
            # Download
            curl -L -o weaver-girl-agent.jar https://github.com/cc11001100/weaver-girl/releases/download/${{ github.ref_name }}/weaver-girl-agent.jar

            # Verify checksum
            sha256sum -c weaver-girl-agent.jar.sha256

            # Use
            java -javaagent:weaver-girl-agent.jar -jar your-app.jar
            ```

            ## Maven Central

            Artifacts are published to Maven Central under
            `com.github.cc11001100:weaver-girl-*`.

            ```xml
            <dependency>
              <groupId>com.github.cc11001100</groupId>
              <artifactId>weaver-girl-core</artifactId>
              <version>${{ github.ref_name }}</version>
            </dependency>
            ```

            ## What's Included
            - 12 built-in plugins: Servlet, Spring, JDBC, Redis, Kafka, gRPC, MongoDB, HttpClient, MethodTiming, TraceCorrelation, ExceptionMonitor, Logging
            - Adaptive sampling, circuit breaker, JMX diagnostics
            - Global emergency kill-switch
            - Hot-reload support

            ## Requirements
            - Java 1.8+
          files: |
            ${{ env.AGENT_JAR }}
            ${{ env.AGENT_JAR }}.sha256
          draft: false
          prerelease: false
